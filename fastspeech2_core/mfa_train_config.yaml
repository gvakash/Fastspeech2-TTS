# MFA training recipe used for Telugu (no pretrained Telugu aligner exists).
# MFA's default recipe runs ~8 stages of speaker-adapted training, which takes many hours;
# for ~6 h of clean single-voice studio speech a monophone + triphone model is enough
# to get good phone boundaries. [NEW]
beam: 10
retry_beam: 40
training:
  - monophone:
      num_iterations: 20
      subset: 0
      max_gaussians: 1000
      boost_silence: 1.25
  - triphone:
      num_iterations: 20
      subset: 0
      num_leaves: 1500
      max_gaussians: 8000
      boost_silence: 1.25
