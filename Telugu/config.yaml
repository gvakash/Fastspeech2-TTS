# FastSpeech 2 - Telugu (IndicTTS Telugu)
# One file replaces ming024's preprocess.yaml + model.yaml + train.yaml.
# ${DATA_ROOT} defaults to Telugu/data; set FS2_DATA_ROOT to move it (Kaggle: /tmp/fs2).

preprocess:
  dataset: "IndicTTS_Telugu"
  path:
    raw_path: "${DATA_ROOT}/raw_data"
    preprocessed_path: "${DATA_ROOT}/preprocessed"
    lexicon_path: "${DATA_ROOT}/lexicon.txt"

  data:
    hf_repo: "SPRINGLab/IndicTTS_Telugu"
    hf_token_env: "HF_TOKEN"
    download_dir: "${DATA_ROOT}/hf_download"
    audio_column: "audio"
    text_column: "text"
    speaker_columns: ["gender"]           # IndicTTS: one female + one male voice
    speaker_label_names: ["female", "male"]
    preferred_speakers: ["female"]        # single-speaker model if she has >= 6 h usable audio
    id_prefix: "te"
    min_duration: 1.0
    max_duration: 15.0
    drop_noisiest_fraction: 0.0           # studio recordings
    train_hours: 5.0
    val_hours: 1.0
    seed: 1234

  alignment:
    mode: "train"                         # no pretrained Telugu MFA model -> train one on this corpus
    mfa_bin: "mfa"
    num_jobs: 4
    beam: 100
    retry_beam: 400

  preprocessing:
    text:
      text_cleaners: []
      language: "te"
    audio:
      sampling_rate: 22050
      max_wav_value: 32768.0
    stft:
      filter_length: 1024
      hop_length: 256
      win_length: 1024
    mel:
      n_mel_channels: 80
      mel_fmin: 0
      mel_fmax: 8000
    pitch:
      feature: "phoneme_level"
      normalization: True
      f0_floor: 65.0
      f0_ceil: 600.0
    energy:
      feature: "phoneme_level"
      normalization: True
    max_frames: 1550
    max_phone_frames: 100
    num_workers: 4

model:
  transformer:
    encoder_layer: 4
    encoder_head: 2
    encoder_hidden: 256
    decoder_layer: 6
    decoder_head: 2
    decoder_hidden: 256
    conv_filter_size: 1024
    conv_kernel_size: [9, 1]
    encoder_dropout: 0.2
    decoder_dropout: 0.2
  variance_predictor:
    filter_size: 256
    kernel_size: 3
    dropout: 0.5
  variance_embedding:
    pitch_quantization: "linear"
    energy_quantization: "linear"
    n_bins: 256
  multi_speaker: auto           # becomes False when only the female voice is used
  max_seq_len: 1600
  vocoder:
    model: "HiFi-GAN"
    speaker: "universal"

train:
  path:
    ckpt_path: "./checkpoints"
    log_path: "./logs"
    result_path: "${ROOT_DIR}/Results/Telugu"
  optimizer:
    batch_size: 16
    group_size: 4
    betas: [0.9, 0.98]
    eps: 0.000000001
    weight_decay: 0.0
    grad_clip_thresh: 1.0
    grad_acc_step: 1
    warm_up_step: 4000
    anneal_steps: [50000, 70000, 90000]
    anneal_rate: 0.3
  step:
    total_step: 100000
    log_step: 100
    synth_step: 5000
    val_step: 1000
    save_step: 5000
    keep_last: 2
  num_workers: 2
  use_amp: false

inference:
  test_sentences: "./test_sentences.txt"
  output_dir: "${ROOT_DIR}/Results/Telugu"
  checkpoint: "best"
  speaker: "auto"
